# Dependabot VERSION updates.
#
# Security updates are a separate repo setting (Settings -> Code security) and
# need no config here — this file only governs proactive version bumps.
#
# Cadence: quarterly — Dependabot runs on the 1st of Jan / Apr / Jul / Oct.
# Major versions are intentionally INCLUDED (no semver-major ignore rule).
#
# The root npm entry is intentionally UNGROUPED: Dependabot computes an
# out-of-sync root package-lock.json for multi-dependency update PRs in this
# npm-workspaces/single-lockfile layout (npm ci fails EUSAGE; see broken PRs
# #151/#157/#199/#202). Individual PRs are the only shape that lands. Note
# Dependabot manifest-bump PRs for exact-pinned direct deps still arrive red
# and are carried manually; lockfile-only security PRs remain auto-mergeable.
version: 2

updates:
  # ── Root npm workspace graph (apps/* + packages/*, single root lockfile) ─────
  # Dependabot detects the workspaces from the root package.json + lockfile and
  # proposes updates across every workspace. UNGROUPED — see header rationale.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build" # -> build(deps): / build(deps-dev): (matches repo history)
      include: "scope"
    ignore:
      # Keep @types/node aligned with the pinned Node 24 runtime (.mise.toml /
      # engines). A major bump describes APIs the Node 24 host doesn't have, so
      # it type-checks green but can fail at runtime. Bump this together with
      # .mise.toml + engines when the runtime moves, then drop this rule.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ── Standalone migration tool (own lockfile, OUTSIDE the npm workspaces) ─────
  # Optional: remove this block if you don't want PRs for the one-time SQL->Blob
  # migration tool. It pulls `mssql` and is never deployed.
  - package-ecosystem: "npm"
    directory: "/scripts/migrate"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      migrate-dependencies:
        patterns:
          - "*"

  # ── GitHub Actions (workflows pin actions by commit SHA — keep them current) ─
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
