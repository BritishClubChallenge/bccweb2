name: Temporary official npm relock

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: temporary-official-npm-relock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relock:
    name: Generate official npm lock
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'plan/security-vulnerability-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_REPLACE_REGISTRY_HOST: npmjs
      ARTIFACT_NAME: official-npm-relock-${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out PR merge ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node with mise
        uses: ./.github/actions/setup-node-mise

      - name: Capture provenance and baseline topology
        env:
          EXPECTED_REPOSITORY: matt-FFFFFF/bccweb2
          EXPECTED_HEAD_REF: plan/security-vulnerability-remediation
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_HEAD_REF"
          registry="$(npm config get registry)"
          test "${registry%/}" = "https://registry.npmjs.org"
          baseline="$RUNNER_TEMP/relock-baseline"
          install -d -m 0700 "$baseline/apps/api" "$baseline/apps/web"
          install -m 0600 package.json "$baseline/package.json"
          install -m 0600 apps/api/package.json "$baseline/apps/api/package.json"
          install -m 0600 apps/web/package.json "$baseline/apps/web/package.json"
          install -m 0600 package-lock.json "$baseline/package-lock.json"
          printf 'repository=%s\npr=%s\nhead_sha=%s\nmerge_sha=%s\nworkflow=%s\nregistry=%s\nnode=%s\nnpm=%s\n' \
            "$GITHUB_REPOSITORY" \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "$GITHUB_SHA" \
            "$GITHUB_WORKFLOW" \
            "$registry" \
            "$(node --version)" \
            "$(npm --version)"
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rows = Object.entries(lock.packages)
            .filter(([path]) => path === 'node_modules/postcss' || path.endsWith('/node_modules/postcss'))
            .map(([path, value]) => ({ path, version: value.version, resolved: value.resolved }));
          console.log(`baseline_postcss_json=${JSON.stringify(rows)}`);
          for (const [path, value] of Object.entries(lock.packages)) {
            if (value.dependencies?.postcss) {
              console.log(`postcss_parent_range=${path || '<root>'}:${value.version ?? '<workspace>'}:${value.dependencies.postcss}`);
            }
          }
          NODE

      - name: Apply approved dependency refreshes
        run: |
          set -euo pipefail
          npm install applicationinsights@3.16.0 \
            --workspace=@bccweb/api --save-exact --package-lock-only --ignore-scripts --no-audit
          npm install react-router@8.3.0 \
            --workspace=@bccweb/web --save-exact --package-lock-only --ignore-scripts --no-audit
          npm install \
            @opentelemetry/propagator-jaeger@2.9.0 protobufjs@7.6.5 \
            dompurify@3.4.13 undici@7.29.0 postcss@8.5.23 \
            nanoid@3.3.18 brace-expansion@5.0.9 \
            --save-exact --package-lock-only --ignore-scripts --no-audit
          npm uninstall \
            @opentelemetry/propagator-jaeger protobufjs dompurify undici \
            postcss nanoid brace-expansion \
            --package-lock-only --ignore-scripts --no-audit

      - name: Run decisive named PostCSS update
        run: npm update postcss --workspaces --include-workspace-root --package-lock-only --ignore-scripts --no-audit --registry=https://registry.npmjs.org/

      - name: Assert manifests, PostCSS, and closure diff
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const semver = require('semver');
          const baselineDir = `${process.env.RUNNER_TEMP}/relock-baseline`;
          const parse = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const sortObject = (value) => {
            if (Array.isArray(value)) return value.map(sortObject);
            if (value === null || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value).sort(([left], [right]) =>
              left.localeCompare(right)).map(([key, nested]) => [key, sortObject(nested)]));
          };
          const stable = (value) => JSON.stringify(sortObject(value));
          const baselineRoot = parse(`${baselineDir}/package.json`);
          const baselineApi = parse(`${baselineDir}/apps/api/package.json`);
          const baselineWeb = parse(`${baselineDir}/apps/web/package.json`);
          const root = parse('package.json');
          const api = parse('apps/api/package.json');
          const web = parse('apps/web/package.json');
          const before = parse(`${baselineDir}/package-lock.json`);
          const after = parse('package-lock.json');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          const expectedApi = structuredClone(baselineApi);
          const expectedWeb = structuredClone(baselineWeb);
          expectedApi.dependencies.applicationinsights = '3.16.0';
          expectedWeb.dependencies['react-router'] = '8.3.0';
          assert(stable(root) === stable(baselineRoot), 'root manifest drift');
          assert(stable(api) === stable(expectedApi), 'api manifest drift');
          assert(stable(web) === stable(expectedWeb), 'web manifest drift');

          const packageName = (path, value) => {
            if (value?.name) return value.name;
            const marker = 'node_modules/';
            const index = path.lastIndexOf(marker);
            if (index < 0) return null;
            const tail = path.slice(index + marker.length).split('/');
            return tail[0]?.startsWith('@') ? `${tail[0]}/${tail[1]}` : tail[0];
          };
          const nameGraph = (lock) => {
            const graph = new Map();
            for (const [path, value] of Object.entries(lock.packages)) {
              const name = packageName(path, value);
              if (!name) continue;
              const dependencies = new Set(Object.keys(value.dependencies ?? {}));
              const existing = graph.get(name) ?? new Set();
              for (const dependency of dependencies) existing.add(dependency);
              graph.set(name, existing);
            }
            return graph;
          };
          const combined = nameGraph(before);
          for (const [name, dependencies] of nameGraph(after)) {
            const existing = combined.get(name) ?? new Set();
            for (const dependency of dependencies) existing.add(dependency);
            combined.set(name, existing);
          }
          const roots = [
            'applicationinsights', 'react-router', '@opentelemetry/propagator-jaeger',
            'protobufjs', 'dompurify', 'undici', 'postcss', 'nanoid', 'brace-expansion',
          ];
          const allowed = new Set(['@bccweb/api', '@bccweb/web']);
          const queue = [...roots];
          while (queue.length > 0) {
            const name = queue.shift();
            if (allowed.has(name)) continue;
            allowed.add(name);
            for (const dependency of combined.get(name) ?? []) queue.push(dependency);
          }

          const paths = [...new Set([
            ...Object.keys(before.packages), ...Object.keys(after.packages),
          ])].sort();
          const changed = [];
          for (const path of paths) {
            const oldValue = before.packages[path];
            const newValue = after.packages[path];
            if (stable(oldValue ?? null) === stable(newValue ?? null)) continue;
            changed.push({
              path,
              package: packageName(path, newValue ?? oldValue),
              oldVersion: oldValue?.version ?? '<absent>',
              newVersion: newValue?.version ?? '<absent>',
              oldResolved: oldValue?.resolved ?? '<absent>',
              newResolved: newValue?.resolved ?? '<absent>',
            });
          }
          console.log(`changed_lock_json=${JSON.stringify(changed)}`);
          console.log(`changed_lock_paths=${changed.length}`);
          const rejected = changed.filter(({ path, package: name }) =>
            path !== 'apps/api' && path !== 'apps/web' && (!name || !allowed.has(name)));
          if (rejected.length > 0) {
            console.log(`rejected_lock_json=${JSON.stringify(rejected)}`);
            throw new Error(`unrelated lock churn: ${rejected.length} paths`);
          }

          const postcss = Object.entries(after.packages)
            .filter(([path]) => path === 'node_modules/postcss' || path.endsWith('/node_modules/postcss'))
            .map(([path, value]) => ({ path, ...value }));
          assert(postcss.length > 0, 'PostCSS missing');
          for (const value of postcss) {
            assert(semver.gte(value.version, '8.5.23'), `${value.path} below 8.5.23`);
            assert(value.resolved.startsWith('https://registry.npmjs.org/postcss/-/postcss-'), `${value.path} registry URL`);
            assert(value.integrity.startsWith('sha512-'), `${value.path} sha512 integrity`);
          }
          console.log(`final_postcss_json=${JSON.stringify(postcss.map(({ path, version, resolved, integrity }) => ({ path, version, resolved, integrity })))}`);
          console.log(`allowed_closure_json=${JSON.stringify([...allowed].sort())}`);
          console.log('closure_diff_assertions=PASS');
          NODE

      - name: Reproduce and audit selected graph
        run: |
          set -euo pipefail
          npm ci --registry=https://registry.npmjs.org/
          npm view nanoid@3.3.18 dist.tarball dist.integrity version --json > "$RUNNER_TEMP/nanoid-dist.json"
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/production-audit.json"
          npm audit --json > "$RUNNER_TEMP/full-audit.json"
          npm ls @opentelemetry/propagator-jaeger protobufjs dompurify undici \
            postcss nanoid brace-expansion applicationinsights react-router --all
          node <<'NODE'
          const fs = require('node:fs');
          const semver = require('semver');
          const parse = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const api = parse('apps/api/package.json');
          const web = parse('apps/web/package.json');
          const root = parse('package.json');
          const lock = parse('package-lock.json');
          const dist = parse(`${process.env.RUNNER_TEMP}/nanoid-dist.json`);
          const productionAudit = parse(`${process.env.RUNNER_TEMP}/production-audit.json`);
          const fullAudit = parse(`${process.env.RUNNER_TEMP}/full-audit.json`);
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const rows = (name) => {
            const suffix = `node_modules/${name}`;
            return Object.entries(lock.packages)
              .filter(([path]) => path === suffix || path.endsWith(`/${suffix}`))
              .map(([path, value]) => ({ path, version: value.version }));
          };
          assert(api.dependencies.applicationinsights === '3.16.0', 'applicationinsights');
          assert(web.dependencies['react-router'] === '8.3.0', 'react-router');
          for (const manifest of [root, api, web]) {
            for (const name of ['dompurify', 'undici', 'postcss', 'nanoid', 'brace-expansion']) {
              assert(manifest.dependencies?.[name] === undefined, `${name} direct dependency`);
              assert(manifest.devDependencies?.[name] === undefined, `${name} direct devDependency`);
            }
          }
          assert(root.overrides?.nanoid === undefined, 'nanoid override');
          assert(lock.lockfileVersion === 3, 'lockfileVersion');
          for (const [name, minimum] of new Map([
            ['@opentelemetry/propagator-jaeger', '2.9.0'], ['protobufjs', '7.6.5'],
            ['dompurify', '3.4.13'], ['postcss', '8.5.23'], ['nanoid', '3.3.18'],
            ['brace-expansion', '5.0.9'],
          ])) {
            const found = rows(name);
            assert(found.length > 0, `${name} missing`);
            assert(found.every(({ version }) => semver.gte(version, minimum)), `${name} below ${minimum}`);
            console.log(`${name}=${found.map(({ path, version }) => `${path}:${version}`).join(',')}`);
          }
          const undici7 = rows('undici').filter(({ version }) => semver.major(version) === 7);
          assert(undici7.length > 0 && undici7.every(({ version }) => semver.gte(version, '7.29.0')), 'undici 7');
          const nanoid = lock.packages['node_modules/nanoid'];
          assert(nanoid.version === '3.3.18', 'nanoid version');
          assert(nanoid.resolved === dist['dist.tarball'], 'nanoid official tarball');
          assert(nanoid.integrity === dist['dist.integrity'], 'nanoid official integrity');
          assert(nanoid.resolved === 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz', 'nanoid URL');
          for (const [name, audit] of [['production', productionAudit], ['full', fullAudit]]) {
            assert(audit.metadata.vulnerabilities.total === 0, `${name} audit total`);
            assert(Object.keys(audit.vulnerabilities ?? {}).length === 0, `${name} advisories`);
          }
          const targetGhsas = [
            'GHSA-3jxr-9vmj-r5cp', 'GHSA-j3f2-48v5-ccww', 'GHSA-45rx-2jwx-cxfr',
            'GHSA-c2j3-45gr-mqc4', 'GHSA-r28c-9q8g-f849', 'GHSA-8xcm-r25x-g524',
            'GHSA-4cwx-7wf7-3272', 'GHSA-v3r7-h72x-cjcm', 'GHSA-jr45-8vmc-qm54',
            'GHSA-m8rv-5g2x-5cg5', 'GHSA-qwww-vcr4-c8h2', 'GHSA-55q2-fjhq-7xh7',
            'GHSA-fxqj-rqcc-2cmp', 'GHSA-2v37-7h3g-55p8',
          ];
          const auditJson = JSON.stringify(fullAudit);
          for (const ghsa of targetGhsas) assert(!auditJson.includes(ghsa), `${ghsa} remains`);
          console.log(`nanoid_tarball=${nanoid.resolved}`);
          console.log(`nanoid_integrity=${nanoid.integrity}`);
          console.log('dependency_assertions=PASS');
          NODE

      - name: Verify published nanoid contents
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-pack" "$RUNNER_TEMP/npm-published"
          npm pack nanoid@3.3.18 --json --pack-destination "$RUNNER_TEMP/npm-pack" > "$RUNNER_TEMP/nanoid-pack.json"
          tar -xzf "$RUNNER_TEMP/npm-pack/nanoid-3.3.18.tgz" -C "$RUNNER_TEMP/npm-published"
          diff -qr "$RUNNER_TEMP/npm-published/package" node_modules/nanoid
          published_files="$(find "$RUNNER_TEMP/npm-published/package" -type f | wc -l | tr -d ' ')"
          installed_files="$(find node_modules/nanoid -type f | wc -l | tr -d ' ')"
          test "$published_files" = "$installed_files"
          printf 'published_nanoid_files=%s\ninstalled_nanoid_files=%s\n' "$published_files" "$installed_files"

      - name: Package checksummed dependency files
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/relock-payload"
          install -d -m 0700 "$payload/apps/api" "$payload/apps/web"
          install -m 0600 apps/api/package.json "$payload/apps/api/package.json"
          install -m 0600 apps/web/package.json "$payload/apps/web/package.json"
          install -m 0600 package-lock.json "$payload/package-lock.json"
          (
            cd "$payload"
            sha256sum apps/api/package.json apps/web/package.json package-lock.json > SHA256SUMS
            tar -czf "$RUNNER_TEMP/official-npm-relock.tar.gz" \
              SHA256SUMS apps/api/package.json apps/web/package.json package-lock.json
          )
          sha256sum "$RUNNER_TEMP/official-npm-relock.tar.gz" > "$RUNNER_TEMP/official-npm-relock.tar.gz.sha256"
          tar -tzf "$RUNNER_TEMP/official-npm-relock.tar.gz"
          cat "$RUNNER_TEMP/official-npm-relock.tar.gz.sha256"

      - name: Upload trusted relock artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ runner.temp }}/official-npm-relock.tar.gz
            ${{ runner.temp }}/official-npm-relock.tar.gz.sha256
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

      - name: Emit artifact receipt
        run: |
          printf 'artifact_name=%s\nartifact_id=%s\nartifact_digest=%s\n' \
            "$ARTIFACT_NAME" \
            '${{ steps.upload.outputs.artifact-id }}' \
            '${{ steps.upload.outputs.artifact-digest }}'
